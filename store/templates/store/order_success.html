{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Buyurtma muvaffaqiyatli!</title>
    <style>
        body {
            background-color: #e9ffe9;
            font-family: 'Segoe UI', sans-serif;
        }
        .success-container {
            max-width: 700px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 40px 50px;
            text-align: center;
        }
        h1 {
            color: #28a745;
            font-size: 34px;
            margin-bottom: 20px;
        }
        .info {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .highlight {
            font-weight: bold;
        }
        .delivery {
            margin-top: 30px;
            font-size: 20px;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="success-container">
    
        <h1 style="color: green;">✅ Buyurtmangiz qabul qilindi!</h1>
        <p><strong>Buyurtma vaqti:</strong> {{ order_time }}</p>
        
        <h2><strong>Buyurtma qilgan ma'lumotlar:</strong></h2>
        <p>Ism: {{ checkout_data.name }}</p>
        <p>Telefon: {{ checkout_data.phone }}</p>
        <p>Manzil: {{ checkout_data.address }}</p>
        
        <p>🛵 Buyurtmangiz 2-3 kun ichida kuryer orqali yetkaziladi!</p>
    </div>
</body>
</html>
