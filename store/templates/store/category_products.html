<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }} mahsulotlari</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">{{ category.name }} mahsulotlari</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {% for product in products %}
            <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">{{ product.name }}</h2>
                    <p class="text-gray-700 text-sm mb-2">{{ product.description|truncatechars:60 }}</p>

                    <a href="{% url 'product_detail' product.id %}" class="text-blue-600 hover:underline text-sm mb-2 inline-block">
                        Batafsil...
                    </a>

                    <p class="text-lg font-bold text-green-700 mb-4">{{ product.price }} so‘m</p>

                    <form method="post" action="{% url 'add_to_cart' product.id %}">
                        {% csrf_token %}
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl w-full">
                            Savatchaga qo‘shish
                        </button>
                    </form>
                </div>
            </div>
            {% empty %}
                <p class="col-span-full text-center text-gray-500">Bu kategoriyada mahsulot yo‘q.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
