<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtma Qabul Qilindi</title>
    <style>
        body {
            background-color: #e6f4e6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }
        .success {
            color: #28a745;
            font-size: 24px;
            font-weight: bold;
        }
        .info {
            margin-top: 20px;
            text-align: left;
        }
        .info label {
            display: block;
            margin: 10px 0 5px;
        }
        .info input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .delivery {
            color: #dc3545;
            font-size: 14px;
            margin-top: 20px;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success">
            ✅ Buyurtmangiz qabul qilindi!
        </div>
        <form class="info" action="/submit-checkout" method="POST">
            <h3>Buyurtma qilgan ma'lumotlar:</h3>
            <label for="name">Ism:{{ name }}</label>

            <label for="name">Familya:{{ last_name }}</label>
            <label for="phone">Telefon:{{ phone }}</label>
            
            <label for="address">Manzil:{{ address }}</label>
            
        </form>
        <div class="delivery">
            🚚 Buyurtmangiz 2-3 kun ichida kuryer orqali yetkaziladi!
        </div>
    </div>
</body>
</html>
