<!-- store/product_detail.html -->
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ffe6f0, #ffcce0);
            font-family: 'Poppins', sans-serif;
        }
        .card {
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }
        button {
            transition: all 0.3s ease;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-10">
        <div class="card bg-white p-6 rounded-2xl shadow-md max-w-2xl mx-auto">
            <!-- Mahsulot rasmi -->
            <img src="{{ product.image.url }}" alt="{{ product.name }}"
                 class="w-full h-72 object-cover mb-6 rounded-xl shadow">

            <h1 class="text-3xl font-extrabold text-pink-600 mb-4">{{ product.name }}</h1>
            <p class="text-gray-700 leading-relaxed mb-4">{{ product.description }}</p>
            <p class="text-2xl font-bold text-green-700 mb-6">{{ product.price }} so‘m</p>

            <!-- Savatchaga qo‘shish formasi -->
            <form method="post" action="{% url 'store:add_to_cart' product.id %}">
                {% csrf_token %}
                <button type="submit"
                    class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-full w-full font-semibold shadow-md">
                    Savatchaga qo‘shish 🛒
                </button>
            </form>

            <!-- Orqaga qaytish -->
            <a href="javascript:history.back()"
               class="text-pink-600 hover:underline mt-6 inline-block font-medium">
                ⬅ Orqaga
            </a>
        </div>
    </div>
</body>
</html>
